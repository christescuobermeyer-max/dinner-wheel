<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>思思大王的晚餐转盘机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a0638;--bg2:#0b0220;--pink:#ff2e93;--cyan:#19f0ff;--yellow:#ffd23f;--violet:#7c4dff;--ink:#fff;--panel:#2a0c57;
  --size:min(86vw,60vh,430px);
  --cn:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --px:"Press Start 2P","Courier New",monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:var(--cn);color:var(--ink);overflow-x:hidden;
  background:
   linear-gradient(rgba(25,240,255,.12) 1px,transparent 1px) 0 0/40px 40px,
   linear-gradient(90deg,rgba(255,46,147,.12) 1px,transparent 1px) 0 0/40px 40px,
   radial-gradient(ellipse at 50% 0%,#4b1a9a 0%,var(--bg1) 40%,var(--bg2) 100%);
  background-color:#12042b;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
main{max-width:520px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:10px;color:var(--cyan)}
.top b{color:var(--yellow);font-weight:400}
.mute{background:none;border:2px solid var(--cyan);color:var(--cyan);border-radius:8px;font-size:16px;padding:2px 8px;cursor:pointer}
h1{margin:4px 0 0;text-align:center;font-weight:400;font-size:clamp(32px,9vw,46px);line-height:1.1;letter-spacing:2px;
  color:#fff;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink),0 0 40px var(--pink),3px 3px 0 var(--violet);
  animation:flick 4s infinite}
h1 small{display:block;margin-top:8px;font-family:var(--px);font-size:11px;letter-spacing:1px;color:var(--yellow);text-shadow:0 0 10px var(--yellow);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.7}94%{opacity:1}96%{opacity:.8}}
.box{position:relative;width:var(--size);height:var(--size);margin-top:10px}
.frame{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#ffd23f,#ff8a00,#ffd23f,#ff2e93,#ffd23f,#19f0ff,#ffd23f);
  box-shadow:0 0 0 4px #12042b,0 0 30px 6px rgba(255,46,147,.7),0 0 80px 10px rgba(124,77,255,.55),inset 0 0 20px rgba(0,0,0,.5)}
.bulb{position:absolute;width:3.2%;height:3.2%;border-radius:50%;transform:translate(-50%,-50%);background:#fff7c2;
  box-shadow:0 0 6px 2px #ffe66b;animation:bulb .7s steps(2) infinite}
.bulb:nth-child(even){animation-delay:.35s}
.fast .bulb{animation-duration:.18s}
@keyframes bulb{0%{opacity:1}50%{opacity:.25;box-shadow:none}}
canvas#wheel{position:absolute;inset:6.5%;width:87%;height:87%;border-radius:50%;box-shadow:0 0 0 5px #12042b,inset 0 0 14px rgba(0,0,0,.6)}
.hub{position:absolute;left:50%;top:50%;width:21%;height:21%;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #fff;
  background:radial-gradient(circle at 35% 30%,#ff8fc3,var(--pink) 55%,#a0005a);color:#fff;font-family:var(--px);font-size:clamp(10px,3vw,14px);
  display:grid;place-items:center;box-shadow:0 0 0 4px #12042b,0 0 20px var(--pink);cursor:pointer;padding:0}
.hub:active{transform:translate(-50%,-50%) scale(.94)}
.pointer{position:absolute;left:50%;top:-3.5%;width:11%;height:14%;transform:translateX(-50%) rotate(0deg);transform-origin:50% 20%;z-index:3;transition:transform .08s;
  filter:drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 3px 0 #12042b)}
.pointer svg{width:100%;height:100%;display:block}
.hit{transform:translateX(-50%) rotate(-22deg)}
#start{position:relative;width:min(78vw,320px);padding:16px 10px 20px;border:0;border-radius:18px;cursor:pointer;
  font-family:var(--cn);font-size:36px;letter-spacing:6px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);
  background:linear-gradient(#ff6aa8,var(--pink) 50%,#d1006f);
  box-shadow:0 8px 0 #7a0040,0 12px 0 #12042b,0 0 30px rgba(255,46,147,.7);transition:transform .08s,box-shadow .08s;animation:pulse 1.2s ease-in-out infinite}
#start small{display:block;font-family:var(--px);font-size:9px;letter-spacing:1px;color:var(--yellow);margin-top:4px}
#start:active:not(:disabled){transform:translateY(8px);box-shadow:0 0 0 #7a0040,0 4px 0 #12042b,0 0 30px rgba(255,46,147,.7)}
#start:disabled{animation:none;filter:grayscale(.6) brightness(.8);cursor:not-allowed}
@keyframes pulse{50%{transform:scale(1.04)}}
.hist{width:100%;border:3px dashed rgba(25,240,255,.6);border-radius:14px;padding:10px 12px;background:rgba(42,12,87,.65)}
.hist h2{margin:0 0 8px;font-weight:400;font-family:var(--px);font-size:10px;color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{background:var(--violet);border:2px solid #fff;border-radius:999px;padding:3px 10px;font-size:15px}
.empty{color:#b9a3ff;font-size:15px}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;background:rgba(8,0,24,.78);backdrop-filter:blur(3px)}
.modal.on{display:grid}
.card{position:relative;width:min(92vw,420px);text-align:center;padding:26px 20px 22px;border-radius:22px;border:4px solid var(--yellow);
  background:linear-gradient(160deg,#3b1480,#1a0638);box-shadow:0 0 0 4px #12042b,0 0 50px var(--pink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.card .tag{font-family:var(--px);font-size:10px;color:var(--yellow);line-height:1.8;animation:blink 1s steps(2) infinite}
.card .who{font-size:22px;margin:10px 0 0}
.card .emo{font-size:76px;line-height:1.1;margin:4px 0;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.card .name{font-size:54px;line-height:1.1;color:#fff;text-shadow:0 0 10px var(--cyan),0 0 26px var(--cyan),3px 3px 0 var(--pink)}
.why{margin:16px 0 4px;padding:12px 14px;border-radius:12px;background:rgba(255,210,63,.12);border:2px solid var(--yellow);font-size:19px;line-height:1.55;text-align:left}
.why i{display:block;font-style:normal;font-family:var(--px);font-size:9px;color:var(--yellow);margin-bottom:6px}
.sign{text-align:right;font-size:14px;color:#c9b5ff;margin-bottom:14px}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:12px 6px;border-radius:12px;border:0;font-family:var(--cn);font-size:20px;cursor:pointer;color:#12042b;
  background:linear-gradient(#fff08a,var(--yellow));box-shadow:0 5px 0 #a47a00}
.btns button.b2{background:linear-gradient(#8cf8ff,var(--cyan));box-shadow:0 5px 0 #007c88}
.btns button:active{transform:translateY(5px);box-shadow:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){h1,#start,.bulb,.tag,.emo{animation:none}}
</style>
</head>
<body>
<main>
  <div class="top"><span>COIN <b id="coin">03</b></span><span>PLAYER: <b>SISI</b></span><button class="mute" id="mute" aria-label="声音开关">🔊</button></div>
  <h1>思思大王<br>晚餐转盘机<small>INSERT COIN · PRESS START</small></h1>
  <div class="box" id="box">
    <div class="frame" id="frame"></div>
    <canvas id="wheel"></canvas>
    <div class="pointer" id="ptr"><svg viewBox="0 0 40 56"><path d="M20 54 L3 18 A19 19 0 1 1 37 18 Z" fill="#ffd23f" stroke="#fff" stroke-width="3"/><circle cx="20" cy="19" r="6" fill="#ff2e93" stroke="#fff" stroke-width="2"/></svg></div>
    <button class="hub" id="hub" aria-label="开始">GO!</button>
  </div>
  <button id="start">开始抽奖<small>TAP TO SPIN</small></button>
  <section class="hist"><h2>HISTORY 战绩</h2><div class="chips" id="chips"><span class="empty">还没有战绩，快让大王转一把！</span></div></section>
</main>

<div class="modal" id="modal">
  <div class="card">
    <div class="tag">★ YOU WIN ★ 大奖已出炉 ★</div>
    <p class="who">思思大王，今晚吃——</p>
    <div class="emo" id="rEmo">🍣</div>
    <div class="name" id="rName">日料</div>
    <div class="why"><i>WHY 为什么吃它</i><span id="rWhy"></span></div>
    <div class="sign">—— 今日饭神签 · 不得反驳</div>
    <div class="btns"><button id="ok">就这么定了！</button><button class="b2" id="again">再来一把</button></div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
const FOODS=[
 {n:"日料",e:"🍣",c:"#ff2e93",q:["人生苦短，先吃刺身。鲜甜入口，烦恼归零。","今天的你值得被三文鱼温柔对待，别问，问就是仪式感。","精致的人从不亏待自己的胃，这顿日料就是你的勋章。"]},
 {n:"韩料",e:"🥘",c:"#ffd23f",q:["没有什么烦恼是一锅部队锅解决不了的，如果有，就加芝士。","烤肉裹生菜，快乐翻三倍，这是科学。","辣得冒汗才叫过瘾，今晚让泡菜替你说话。"]},
 {n:"烧烤",e:"🍢",c:"#19f0ff",q:["夜晚的灵魂是烧烤，滋啦一声，疲惫全消。","一串不够，那就十串，大王的字典里没有“适可而止”。","烟火气里最抚凡人心，撸串才是打工人的终极治愈。"]},
 {n:"砂锅",e:"🍲",c:"#7c4dff",q:["咕嘟咕嘟，热气腾腾，一口下去全是安稳。","外面再冷，砂锅一开，家就在眼前。","慢火煨出来的才是真滋味，今晚对自己好点。"]},
 {n:"炒菜",e:"🥢",c:"#00e676",q:["锅气就是正义，一盘小炒，赛过千言万语。","米饭配炒菜，才是中国胃的灵魂搭档。","简单的快乐最长久，来两个下饭菜，再干三碗饭。"]},
 {n:"西餐",e:"🥩",c:"#ff6d00",q:["刀叉一拿，今晚我就是优雅的大王。","五分熟的牛排，十分满的幸福感。","偶尔精致一下，让生活有点仪式，也让钱包有点故事。"]},
 {n:"烤鱼",e:"🐟",c:"#ff2e93",q:["鱼来运转，今晚不吃鱼，对不起这个好兆头。","一口鲜辣一口嫩，配上土豆片，谁吃谁知道。","鱼肉补脑，大王要多吃，毕竟明天还要运筹帷幄。"]},
 {n:"火锅",e:"🔥",c:"#ffd23f",q:["没有什么事是一顿火锅解决不了的，如果有，就吃两顿。","涮一涮，烫一烫，所有不开心都下锅。","人生就像火锅，什么都能涮，唯独不能涮自己。"]},
 {n:"麻辣烫",e:"🌶️",c:"#19f0ff",q:["自由搭配，想吃啥夹啥，今晚大王说了算。","一碗麻辣烫，汤浓料足，快乐不用排队。","加麻加辣加香菜，这才是生活该有的味道。"]},
 {n:"小龙虾",e:"🦞",c:"#7c4dff",q:["夏夜不吃小龙虾，等于白过了一个晚上。","剥壳是修行，吮指是回报，今晚双手交给虾。","戴上手套，开启战斗，虾不剥完不许走。"]}
];
const N=FOODS.length,S=Math.PI*2/N,TAU=Math.PI*2;
const cv=document.getElementById("wheel"),ctx=cv.getContext("2d");
const ptr=document.getElementById("ptr"),box=document.getElementById("box");
let theta=0,spinning=false,coins=3,last=-1,muted=false,hist=[];

function draw(){
  const d=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth;
  cv.width=cv.height=Math.round(w*d);
  const R=cv.width/2;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.translate(R,R);
  FOODS.forEach((f,i)=>{
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*S,(i+1)*S);ctx.closePath();
    const g=ctx.createRadialGradient(0,0,R*.15,0,0,R);
    g.addColorStop(0,"#2a0c57");g.addColorStop(.3,f.c);g.addColorStop(1,f.c);
    ctx.fillStyle=i%2?g:g;ctx.fill();
    ctx.lineWidth=R*.012;ctx.strokeStyle="rgba(255,255,255,.85)";ctx.stroke();
    ctx.save();ctx.rotate((i+.5)*S);
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font=R*.2+"px serif";ctx.fillText(f.e,R*.72,0);
    ctx.font=R*.125+"px ZCOOL KuaiLe,PingFang SC,Microsoft YaHei,sans-serif";
    ctx.lineJoin="round";ctx.lineWidth=R*.04;ctx.strokeStyle="#1a0638";
    ctx.strokeText(f.n,R*.42,0);ctx.fillStyle="#fff";ctx.fillText(f.n,R*.42,0);
    ctx.restore();
  });
}
function idxAt(t){const a=(((-Math.PI/2-t)%TAU)+TAU)%TAU;return Math.floor(a/S)%N}
function setRot(){cv.style.transform="rotate("+theta+"rad)"}

/* bulbs */
const fr=document.getElementById("frame");
for(let i=0;i<24;i++){const b=document.createElement("i");b.className="bulb";const a=i/24*TAU;
  b.style.left=50+46.4*Math.cos(a)+"%";b.style.top=50+46.4*Math.sin(a)+"%";fr.appendChild(b)}

/* audio */
let ac;
function tone(f,d,type,v,delay){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(delay||0);
  o.type=type||"square";o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.18,"square",.06,i*.11))}

/* spin */
function spin(){
  if(spinning)return;
  spinning=true;box.classList.add("fast");document.getElementById("start").disabled=true;
  coins=Math.max(0,coins-1);if(coins===0)coins=3;
  document.getElementById("coin").textContent=String(coins).padStart(2,"0");
  tone(330,.1,"square",.06);tone(660,.15,"square",.06,.1);
  const pick=Math.floor(Math.random()*N),jit=(Math.random()-.5)*.7;
  const goal=-Math.PI/2-(pick+.5+jit)*S;
  const cur=theta,diff=((((goal-cur)%TAU)+TAU)%TAU)+TAU*(6+Math.floor(Math.random()*3));
  const dur=5600,t0=performance.now();last=idxAt(cur);
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
    theta=cur+diff*e;setRot();
    const k=idxAt(theta);
    if(k!==last){last=k;tone(900+Math.random()*80,.04,"square",.035);ptr.classList.add("hit");setTimeout(()=>ptr.classList.remove("hit"),70)}
    if(p<1)requestAnimationFrame(step);else done(pick);
  })(t0);
}
function done(i){
  spinning=false;box.classList.remove("fast");
  const f=FOODS[i];
  document.getElementById("rEmo").textContent=f.e;
  document.getElementById("rName").textContent=f.n;
  document.getElementById("rWhy").textContent="“"+f.q[Math.floor(Math.random()*f.q.length)]+"”";
  hist.unshift(f.e+" "+f.n);hist=hist.slice(0,8);
  document.getElementById("chips").innerHTML=hist.map(h=>'<span class="chip">'+h+'</span>').join("");
  win();boom();
  setTimeout(()=>document.getElementById("modal").classList.add("on"),350);
}
function close_(){document.getElementById("modal").classList.remove("on");document.getElementById("start").disabled=false}

/* confetti */
const fx=document.getElementById("fx"),fc=fx.getContext("2d");let ps=[],raf=0;
function boom(){
  fx.width=innerWidth;fx.height=innerHeight;
  const cols=["#ff2e93","#ffd23f","#19f0ff","#7c4dff","#00e676","#fff"];
  for(let i=0;i<150;i++)ps.push({x:fx.width/2,y:fx.height*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:5+Math.random()*7,r:Math.random()*6,c:cols[i%6],l:1});
  cancelAnimationFrame(raf);(function f(){
    fc.clearRect(0,0,fx.width,fx.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=.2;p.l-=.008;fc.save();fc.globalAlpha=Math.max(p.l,0);
      fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()});
    ps=ps.filter(p=>p.l>0&&p.y<fx.height+20);
    if(ps.length)raf=requestAnimationFrame(f);else fc.clearRect(0,0,fx.width,fx.height);
  })();
}

/* idle attract rotation */
(function idle(){if(!spinning&&!matchMedia("(prefers-reduced-motion:reduce)").matches){theta+=.004;setRot()}requestAnimationFrame(idle)})();

document.getElementById("start").onclick=spin;
document.getElementById("hub").onclick=spin;
document.getElementById("ok").onclick=close_;
document.getElementById("again").onclick=()=>{close_();setTimeout(spin,200)};
document.getElementById("mute").onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?"🔇":"🔊"};
addEventListener("resize",draw);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
draw();setRot();
</script>
</body>
</html>
